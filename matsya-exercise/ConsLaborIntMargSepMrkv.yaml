name: ConsLaborIntMargSepMrkv
description: >-
  Separable-utility consumption-saving-labor-supply model with an exogenous
  Markov-chain productivity process x_t and labor-proportional dividend
  income (Dupor 2023).  Replaces the permanent/transitory income-shock
  structure of ConsLaborIntMarg with a discrete AR(1)-Tauchen Markov chain
  on productivity, and adds exogenous fiscal flows: a proportional tax Tau,
  a lump-sum transfer Trnsfr, and an intermediate-firm dividend Div whose
  household share is proportional to labor supplied.

  Budget constraint (in levels; no permanent-income normalization):

      c_t + a_{t+1} = T + R * a_t
                    + (1 - Tau) * [WageRte * x_t + (1 - Omega) * (x_t / xBar) * Div] * h_t

  with x_t = xGrid[Mrkv_t] and Mrkv_t ~ Categorical(MrkvArray[Mrkv_{t-1}, :]).

symbols:
  variables:
    - aLvlPrev!          \\ inbound assets (end-of-period assets from t-1)
    - MrkvPrev! (int)    \\ inbound discrete Markov productivity state
    - Mrkv (int)         \\ this period's Markov productivity state
    - xLvl               \\ productivity level x_t = xGrid[Mrkv]
    - bLvl               \\ bank balances before labor income (R*a + Trnsfr)
    - yLvl               \\ effective after-tax labor income (incl. dividends)
    - mLvl               \\ market resources (cash on hand) = bLvl + yLvl
    - cLvl               \\ consumption
    - Lbr                \\ labor supplied on the intensive margin, in [0,1]
    - aLvl               \\ end-of-period assets
    - live (bool)        \\ whether the agent survives this period
  parameters:
    - Rfree+             \\ gross risk-free return on assets
    - LivPrb             \\ survival probability at end of period
    - WageRte            \\ wage rate per unit of effective labor
    - Tau                \\ proportional income-tax rate
    - Trnsfr             \\ lump-sum fiscal transfer T
    - Div                \\ exogenous per-hour-worked dividend D
    - Omega              \\ dividend retention share omega
    - xBar               \\ mean productivity normalization (E[x] approx xBar)
    - xGrid              \\ array of productivity values (Mrkv indexes it)
    - MrkvArray+         \\ Markov transition matrix on the productivity state
    - MrkvPrbsInit       \\ pmv of initial Markov state (stationary by default)
  functions:
    - cFuncX*            \\ IndexedInterp consumption policy, called as cFuncX(Mrkv, bLvl)
    - LbrFuncX*          \\ IndexedInterp labor policy, called as LbrFuncX(Mrkv, bLvl)
  distributions:
    - kNrmInitDstn       \\ initial asset-LEVEL distribution (reused as aLvlInitDstn)
  arrival: [aLvlPrev, MrkvPrev]
  solution: [cFuncX, LbrFuncX]
  offset: [Rfree, MrkvArray]
initialize: |
  aLvlPrev ~ kNrmInitDstn              \\ draw initial assets
  MrkvPrev ~ {MrkvPrbsInit}            \\ draw initial Markov state from pmv
dynamics: |
  Mrkv ~ {MrkvArray}(MrkvPrev)         \\ transition the discrete Markov state
  xLvl = xGrid[Mrkv]                   \\ productivity x_t indexed by Mrkv
  bLvl = Rfree*aLvlPrev + Trnsfr       \\ bank balances after R*a and transfer
  cLvl = cFuncX@(Mrkv, bLvl)           \\ consumption from Markov-indexed policy
  Lbr  = LbrFuncX@(Mrkv, bLvl)         \\ labor supply from Markov-indexed policy
  yLvl = (1 - Tau)*(WageRte*xLvl + (1 - Omega)*(xLvl/xBar)*Div)*Lbr
  mLvl = bLvl + yLvl                   \\ cash on hand
  aLvl = mLvl - cLvl                   \\ end-of-period assets
  live ~ {LivPrb}                      \\ draw survival
  dead = 1 - live                      \\ decedents are non-survivors
twist:
  aLvl: aLvlPrev
  Mrkv: MrkvPrev
